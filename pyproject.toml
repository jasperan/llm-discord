[project]
name = "llm-discord"
version = "0.1.0"
description = "Discord bot that logs server messages to SQLite, plus scripts to turn them into an LLM fine-tuning dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord",
    "pysqlite3",
    "pyyaml",
    "rich",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
